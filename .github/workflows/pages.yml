name: Deploy web app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,cargo-about
      - name: Bigger thesaurus (Moby Thesaurus II, public domain) - optional, keeps the built-in list if it fails
        continue-on-error: true
        run: |
          curl -fsSL https://www.gutenberg.org/files/3202/files.zip -o /tmp/moby.zip
          unzip -oq /tmp/moby.zip -d /tmp/moby
          f=$(find /tmp/moby -iname 'mthesaur.txt' | head -1)
          test -n "$f"
          python3 packaging/thesaurus/make_thesaurus.py "$f" assets/thesaurus/thesaurus.txt 25
      - run: packaging/web-pwa/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
