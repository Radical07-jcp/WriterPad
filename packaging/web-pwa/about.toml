# cargo-about config: collect licence texts of every Rust crate compiled into the wasm build.
accepted = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "0BSD",
  "OFL-1.1", "Ubuntu-font-1.0", "LicenseRef-UFL-1.0", "NCSA", "OpenSSL", "CDLA-Permissive-2.0",
]
targets = ["wasm32-unknown-unknown"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
